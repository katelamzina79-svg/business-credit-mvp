<div class="grid md:grid-cols-2 gap-3">
  {% for item in suggestions %}
  <article class="rounded-2xl border border-slate-200 border-l-4 border-l-[#EF3124] bg-white p-4 shadow-sm">
    <h3 class="font-semibold text-[#0B1118]">{{ item.title }}</h3>
    <p class="text-sm text-slate-600 mt-2">{{ item.text }}</p>
  </article>
  {% endfor %}
</div>
