{% extends "layout.html" %}
{% block content %}
<style>
  .alfa-card {
    background-color: #FFFFFF !important;
    border: 1px solid #E8EAEF !important;
    border-radius: 12px !important;
    box-shadow: 0px 4px 16px rgba(11, 17, 24, 0.04) !important;
  }
  .alfa-btn {
    background-color: #EF3124 !important;
    color: #FFFFFF !important;
    border-radius: 8px !important;
    font-weight: 600 !important;
    font-family: 'Inter', -apple-system, sans-serif !important;
    transition: background-color 0.15s ease-in-out !important;
  }
  .alfa-btn:hover { background-color: #D7241A !important; }
  .alfa-btn:disabled { opacity: 0.5 !important; cursor: not-allowed !important; }
  .alfa-title {
    color: #0B1118 !important;
    font-family: 'Inter', -apple-system, sans-serif !important;
  }
  .alfa-score {
    background-color: #FFF1F0 !important;
    border-radius: 12px !important;
  }
  .alfa-link { color: #EF3124 !important; }
  .alfa-link:hover { color: #D7241A !important; }
</style>

<div class="max-w-6xl mx-auto">
  <header class="flex flex-wrap items-center justify-between gap-4 mb-8">
    <div>
      <button id="banker-logout" type="button" class="text-sm hover:underline alfa-link">Выйти</button>
      <h1 class="text-3xl font-bold mt-2 alfa-title">Кабинет банкира</h1>
      <p class="text-slate-600 mt-1">Очередь заявок, результаты мок-проверок и объяснимая рекомендация скоринга.</p>
    </div>
    <button id="refresh-queue" class="rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold hover:bg-slate-50">Обновить очередь</button>
  </header>

  <div class="grid sm:grid-cols-3 gap-3 mb-6">
    <div class="bg-white p-4 alfa-card"><p class="text-sm text-slate-500">В очереди</p><p id="queue-total" class="text-2xl font-bold mt-1">—</p></div>
    <div class="bg-white p-4 alfa-card"><p class="text-sm text-slate-500">На скоринге</p><p id="queue-scoring" class="text-2xl font-bold mt-1">—</p></div>
    <div class="bg-white p-4 alfa-card"><p class="text-sm text-slate-500">Подписание / выдача</p><p id="queue-signing" class="text-2xl font-bold mt-1">—</p></div>
  </div>

  <div id="queue-error" role="alert" class="hidden rounded-xl bg-rose-50 text-rose-700 p-4 mb-4"></div>

  <div id="queue-list" class="space-y-4">
    <div class="bg-white p-8 text-center text-slate-500 alfa-card">Загружаем очередь…</div>
  </div>
</div>

<script>
(() => {
  const token = sessionStorage.getItem('businessCreditDemoToken') || '';
  const $ = (id) => document.getElementById(id);
  const statusText = {submitted:'Отправлена',data_check:'Проверка данных',scoring:'Скоринг',approved:'Одобрена',other_terms:'Другие условия',documents_required:'Нужны документы',rejected:'Отказ',signing:'Подписание',disbursed:'Выдана'};
  const decisionText = {approved:'Одобрить',other_terms:'Предложить другие условия',documents_required:'Запросить документы',rejected:'Отказать'};
  const money = (value) => new Intl.NumberFormat('ru-RU',{style:'currency',currency:'RUB',maximumFractionDigits:0}).format(Number(value || 0));
  const escapeHtml = (value) => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));

  async function api(path, options={}) {
    const response = await fetch(path, {
      ...options,
      headers: {'Authorization':'Bearer '+token, ...(options.body ? {'Content-Type':'application/json'} : {}), ...(options.headers || {})}
    });
    let data = null; try { data = await response.json(); } catch (_) {}
    if (!response.ok) throw new Error(data?.detail || ('Ошибка запроса (' + response.status + ')'));
    return data;
  }

  function renderItem(item) {
    const app = item.application;
    const company = item.company;
    const checks = app.external_checks || {};
    const factors = (app.score_factors || []).map(f =>
      '<li class="flex justify-between gap-3 py-1"><span>' + escapeHtml(f.label) + '</span><span class="font-semibold" style="color:#EF3124">' + escapeHtml(f.impact) + ' баллов</span></li>'
    ).join('');
    const reasons = (app.decision_reasons || []).map(r => '<li>' + escapeHtml(r) + '</li>').join('');

    let actions = '';
    if (app.status === 'submitted' || app.status === 'data_check') {
      actions = '<div class="mt-4 rounded-xl bg-amber-50 p-3"><p class="text-sm text-amber-800 mb-2">Проверка данных ещё не завершилась. Можно запустить её повторно.</p><button data-id="' + app.id + '" class="retry-pipeline-btn alfa-btn rounded-xl px-4 py-2 text-sm">Повторить проверку</button></div>';
    } else if (app.status === 'scoring') {
      actions = '<div class="flex flex-wrap gap-2 mt-4">' + Object.keys(decisionText).map(target => {
        const isRec = target === app.decision_recommendation;
        const cls = isRec ? 'alfa-btn' : 'border border-slate-300 bg-white hover:bg-slate-50';
        return '<button data-id="' + app.id + '" data-target="' + target + '" class="decision-btn rounded-xl px-3 py-2 text-sm font-semibold ' + cls + '">' + decisionText[target] + (isRec ? ' · рекомендация' : '') + '</button>';
      }).join('') + '</div>';
    } else if (app.status === 'documents_required') {
      actions = '<div class="mt-4 rounded-xl bg-amber-50 p-3"><p class="text-sm text-amber-800 mb-2">После получения документов можно вернуть заявку на скоринг.</p><button data-id="' + app.id + '" data-target="scoring" class="decision-btn alfa-btn rounded-xl px-4 py-2 text-sm">Документы получены — продолжить скоринг</button></div>';
    } else if (app.status === 'approved' || app.status === 'other_terms') {
      actions = '<p class="mt-4 rounded-xl bg-emerald-50 text-emerald-800 p-3 text-sm">Предложение готово. Ожидаем подпись клиента в личном кабинете.</p>';
    } else if (app.status === 'signing') {
      actions = '<div class="mt-4"><button data-id="' + app.id + '" data-target="disbursed" class="decision-btn rounded-xl bg-emerald-600 text-white px-4 py-2 text-sm font-semibold hover:bg-emerald-700">Отметить выдачу (мок)</button></div>';
    } else if (app.status === 'documents_required') {
      actions = '<div class="mt-4"><p class="text-sm text-amber-700 mb-2">Заявка ожидает дополнительные документы.</p><button data-id="' + app.id + '" data-target="scoring" class="decision-btn rounded-xl border border-slate-300 bg-white px-4 py-2 text-sm font-semibold hover:bg-slate-50">Вернуть на рассмотрение</button></div>';
    }

    const checkCard = (name, data) =>
      '<div class="rounded-xl bg-slate-50 p-3"><p class="text-xs uppercase tracking-wide text-slate-500">' + name + '</p><p class="font-semibold mt-1">' + escapeHtml(data?.status || 'нет данных') + '</p><p class="text-xs text-slate-600 mt-1">' + escapeHtml(data?.source || '') + '</p></div>';

    return '<article class="bg-white p-5 sm:p-6 alfa-card">' +
      '<div class="flex flex-wrap items-start justify-between gap-3">' +
        '<div>' +
          '<p class="text-xs text-slate-500">Заявка №' + app.id + ' · ' + escapeHtml(statusText[app.status] || app.status) + '</p>' +
          '<h2 class="text-xl font-bold mt-1 alfa-title">' + escapeHtml(company.name) + '</h2>' +
          '<p class="text-sm text-slate-600 mt-1">ИНН ' + escapeHtml(company.inn) + ' · ОКВЭД ' + escapeHtml(company.okved) + '</p>' +
          '<p class="mt-2 font-semibold">' + money(app.amount) + ' · ' + app.term_months + ' мес. · ' + escapeHtml(app.product) + '</p>' +
        '</div>' +
        '<div class="alfa-score px-4 py-3 min-w-28">' +
          '<p class="text-xs" style="color:#EF3124">Демо-скоринг</p>' +
          '<p class="text-3xl font-bold alfa-title">' + (app.score ?? '—') + '<span class="text-sm font-medium">/100</span></p>' +
          '<p class="text-xs mt-1" style="color:#EF3124">Риск: ' + escapeHtml(app.risk_level || '—') + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="grid sm:grid-cols-2 gap-3 mt-4">' + checkCard('Мок ЕГРЮЛ', checks.egrul) + checkCard('Мок БКИ', checks.bki) + '</div>' +
      '<div class="grid md:grid-cols-2 gap-4 mt-4">' +
        '<div class="rounded-xl border border-slate-200 p-4"><h3 class="font-semibold">Факторы скоринга</h3><ul class="text-sm mt-2 divide-y divide-slate-100">' + (factors || '<li class="text-slate-500 py-1">Штрафных факторов нет.</li>') + '</ul></div>' +
        '<div class="rounded-xl border border-slate-200 p-4"><h3 class="font-semibold">Рекомендация и причины</h3><p class="text-sm font-semibold mt-2" style="color:#EF3124">' + escapeHtml(decisionText[app.decision_recommendation] || app.decision_recommendation || 'Нет рекомендации') + '</p><ul class="list-disc pl-5 text-sm text-slate-600 mt-2 space-y-1">' + (reasons || '<li>Причины не сформированы.</li>') + '</ul>' + (app.recommended_amount ? '<p class="text-sm mt-3">Рекомендуемая сумма: <strong>' + money(app.recommended_amount) + '</strong></p>' : '') + '</div>' +
      '</div>' + actions + '</article>';
  }

  async function loadQueue() {
    $('queue-error').classList.add('hidden');
    $('queue-list').innerHTML = '<div class="bg-white p-8 text-center text-slate-500 alfa-card">Загружаем очередь…</div>';
    try {
      if (!token) { window.location.href = '/'; return; }
      const user = await api('/api/auth/me');
      if (user.role !== 'banker') { window.location.href = '/'; return; }
      const items = await api('/api/applications/banker/queue');
      $('queue-total').textContent = items.length;
      $('queue-scoring').textContent = items.filter(x => x.application.status === 'scoring').length;
      $('queue-signing').textContent = items.filter(x => ['approved','other_terms','signing'].includes(x.application.status)).length;
      $('queue-list').innerHTML = items.length
        ? items.map(renderItem).join('')
        : '<div class="rounded-2xl border border-dashed border-slate-300 p-10 text-center bg-white"><h2 class="font-semibold">Очередь пуста</h2><p class="text-sm text-slate-500 mt-1">Отправьте тестовую заявку из клиентского кабинета.</p></div>';
    } catch (error) {
      $('queue-error').textContent = error.message;
      $('queue-error').classList.remove('hidden');
      $('queue-list').innerHTML = '';
    }
  }

  $('queue-list').addEventListener('click', async (event) => {
    const retryButton = event.target.closest('.retry-pipeline-btn');
    if (retryButton) {
      retryButton.disabled = true;
      retryButton.textContent = 'Запускаем проверку…';
      try {
        await api('/api/applications/' + retryButton.dataset.id + '/retry-pipeline', {method:'POST'});
        await loadQueue();
      } catch (error) {
        $('queue-error').textContent = error.message;
        $('queue-error').classList.remove('hidden');
        retryButton.disabled = false;
        retryButton.textContent = 'Повторить проверку';
      }
      return;
    }
    const button = event.target.closest('.decision-btn');
    if (!button) return;
    button.disabled = true;
    try {
      await api('/api/applications/' + button.dataset.id + '/transition', {
        method:'POST',
        body: JSON.stringify({target_status: button.dataset.target, comment: 'Решение банкира в демо-кабинете'})
      });
      await loadQueue();
    } catch (error) {
      $('queue-error').textContent = error.message;
      $('queue-error').classList.remove('hidden');
      button.disabled = false;
    }
  });

  $('refresh-queue').addEventListener('click', loadQueue);
  $('banker-logout').addEventListener('click', () => {
    sessionStorage.removeItem('businessCreditDemoToken');
    window.location.href = '/';
  });

  loadQueue();
})();
</script>
{% endblock %}
