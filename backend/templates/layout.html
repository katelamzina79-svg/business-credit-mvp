<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or 'Credit MVP' }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body {
      background-color: #F2F3F5 !important;
      color: #0B1118 !important;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
    }
    .bg-slate-50 { background-color: #F2F3F5 !important; }
    .bg-white { background-color: #FFFFFF !important; }
    .text-slate-900 { color: #0B1118 !important; }
    .rounded-2xl { border-radius: 12px !important; }
    .rounded-xl { border-radius: 8px !important; }
    input, select, textarea {
      font-family: inherit !important;
      border-radius: 8px !important;
    }
    input:focus, select:focus {
      border-color: #EF3124 !important;
      outline: none !important;
      box-shadow: 0 0 0 1px #EF3124 !important;
    }

    /* Левая навигация: меняет только оболочку страницы, не трогая логику приложения. */
    .app-sidebar {
      position: fixed;
      inset: 0 auto 0 0;
      width: 248px;
      background: #FFFFFF;
      border-right: 1px solid #E5E7EB;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      z-index: 40;
    }
    .app-sidebar-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 8px 24px;
      text-decoration: none;
    }
    .app-sidebar-logo-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 11px;
      background: #EF3124;
      color: #FFFFFF;
      font-weight: 800;
    }
    .app-sidebar-logo-title {
      color: #0B1118;
      font-size: 16px;
      line-height: 1.15;
      font-weight: 750;
    }
    .app-sidebar-logo-subtitle {
      color: #94A3B8;
      font-size: 11px;
      margin-top: 3px;
    }
    .app-sidebar-section {
      color: #94A3B8;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 0 10px 8px;
    }
    .app-sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .app-sidebar-link {
      display: flex;
      align-items: center;
      gap: 11px;
      min-height: 42px;
      padding: 9px 11px;
      border-radius: 9px;
      color: #475569;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      transition: background-color .15s ease, color .15s ease;
    }
    .app-sidebar-link:hover {
      background: #F8FAFC;
      color: #0B1118;
    }
    .app-sidebar-link.active {
      background: #FFF1F0;
      color: #EF3124;
    }
    .app-sidebar-icon {
      width: 20px;
      text-align: center;
      font-size: 16px;
      line-height: 1;
    }
    .app-sidebar-bottom {
      margin-top: auto;
      padding: 14px 8px 0;
      border-top: 1px solid #F1F3F6;
      color: #94A3B8;
      font-size: 11px;
      line-height: 1.45;
    }
    .app-page {
      margin-left: 248px;
      min-height: 100vh;
    }
    .app-page > main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 28px;
    }
    @media (max-width: 820px) {
      .app-sidebar {
        position: sticky;
        top: 0;
        width: 100%;
        height: auto;
        padding: 10px 12px;
        border-right: 0;
        border-bottom: 1px solid #E5E7EB;
      }
      .app-sidebar-logo { padding: 2px 4px 10px; }
      .app-sidebar-section { display: none; }
      .app-sidebar-nav {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .app-sidebar-link {
        flex: 0 0 auto;
        min-height: 38px;
        padding: 8px 10px;
      }
      .app-sidebar-bottom { display: none; }
      .app-page { margin-left: 0; }
      .app-page > main { padding: 16px; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="app-sidebar">
    <a href="/" class="app-sidebar-logo">
      <span class="app-sidebar-logo-mark">А</span>
      <span>
        <span class="app-sidebar-logo-title">Бизнес.Кредит</span>
        <span class="app-sidebar-logo-subtitle">Финансирование для бизнеса</span>
      </span>
    </a>

    {% if request.url.path == '/' %}
    <div class="app-sidebar-section">Кабинет</div>
    <nav class="app-sidebar-nav" aria-label="Основная навигация">
      <a class="app-sidebar-link active" href="#app-panel"><span class="app-sidebar-icon">⌂</span><span>Главная</span></a>
      <a class="app-sidebar-link" href="#new-application"><span class="app-sidebar-icon">＋</span><span>Новая заявка</span></a>
      <a class="app-sidebar-link" href="#applications-list"><span class="app-sidebar-icon">▤</span><span>Мои заявки</span></a>
      <a class="app-sidebar-link" href="#smart-feed"><span class="app-sidebar-icon">✦</span><span>Персональные подсказки</span></a>
    </nav>
    {% else %}
    <div class="app-sidebar-section">Работа с заявками</div>
    <nav class="app-sidebar-nav" aria-label="Навигация банкира">
      <a class="app-sidebar-link active" href="/banker"><span class="app-sidebar-icon">▤</span><span>Очередь заявок</span></a>
    </nav>
    {% endif %}

    <div class="app-sidebar-bottom">
      <strong class="text-slate-600">Business Credit MVP</strong><br>
      Демонстрационная версия · тестовые данные
    </div>
  </div>

  <div class="app-page">
    <main>
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>
